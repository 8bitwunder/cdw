name: Update host contribution form

on:
  push:
    branches:
      - feature/host-form-contribution

permissions:
  contents: write

jobs:
  update-host-form:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/host-form-contribution
      - name: Patch host form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old_css = '''.crm-form input[type="text"] {
  inline-size: 100%; min-block-size: 46px; padding: 10px 12px;
  border: 1px solid var(--grey-200); border-radius: 5px;
  background: var(--surface); color: var(--text); font: inherit;
}
.crm-form input[type="text"]:focus { outline: 3px solid rgba(0,180,216,.22); border-color: var(--cdw-teal); }'''
          new_css = '''.crm-form input[type="text"],
.crm-form select,
.crm-form textarea {
  inline-size: 100%; min-block-size: 46px; padding: 10px 12px;
  border: 1px solid var(--grey-200); border-radius: 5px;
  background: var(--surface); color: var(--text); font: inherit;
}
.crm-form textarea { min-block-size: 96px; resize: vertical; }
.crm-form input[type="text"]:focus,
.crm-form select:focus,
.crm-form textarea:focus { outline: 3px solid rgba(0,180,216,.22); border-color: var(--cdw-teal); }'''
          assert old_css in s, 'CSS target not found'
          s = s.replace(old_css, new_css, 1)

          old_form = '''      <div class="zcwf_row">
        <div class="zcwf_col_lab"><label for="host_Email">Email <span class="zcwf_required">*</span></label></div>
        <div class="zcwf_col_fld"><input type="text" ftype="email" id="host_Email" aria-required="true" aria-label="Email" name="Email" maxlength="100" autocomplete="email" inputmode="email" required></div>
      </div>
      <input type="text" class="zcwf_hidden" name="aG9uZXlwb3Q" value="" tabindex="-1" autocomplete="off">'''
          new_form = '''      <div class="zcwf_row">
        <div class="zcwf_col_lab"><label for="host_Email">Email <span class="zcwf_required">*</span></label></div>
        <div class="zcwf_col_fld"><input type="text" ftype="email" id="host_Email" aria-required="true" aria-label="Email" name="Email" maxlength="100" autocomplete="email" inputmode="email" required></div>
      </div>
      <div class="zcwf_row">
        <div class="zcwf_col_lab"><label for="host_Contribution_Type">How would you like to contribute? <span class="zcwf_required">*</span></label></div>
        <div class="zcwf_col_fld">
          <select id="host_Contribution_Type" aria-required="true" aria-label="How would you like to contribute?" required>
            <option value="">Select an option</option>
            <option value="Event Host">Event Host</option>
            <option value="Venue Partner">Venue Partner</option>
            <option value="Sponsor">Sponsor</option>
            <option value="Data Provider">Data Provider</option>
            <option value="Speaker or Panellist">Speaker or Panellist</option>
            <option value="Media and Comms Partner">Media and Comms Partner</option>
            <option value="Academic Partner">Academic Partner</option>
            <option value="Community Partner">Community Partner</option>
            <option value="Careers Mentor">Careers Mentor</option>
            <option value="Hackathon Challenge Setter">Hackathon Challenge Setter</option>
            <option value="Online Event Host">Online Event Host</option>
            <option value="Catering and Hospitality Partner">Catering and Hospitality Partner</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="zcwf_row">
        <div class="zcwf_col_lab"><label for="host_Idea">Tell us briefly what you have in mind</label></div>
        <div class="zcwf_col_fld"><textarea id="host_Idea" aria-label="Tell us briefly what you have in mind" maxlength="3000" placeholder="A few sentences is plenty."></textarea></div>
      </div>
      <textarea class="zcwf_hidden" id="host_Description" name="Description" aria-hidden="true" tabindex="-1"></textarea>
      <input type="text" class="zcwf_hidden" name="aG9uZXlwb3Q" value="" tabindex="-1" autocomplete="off">'''
          assert old_form in s, 'Host form target not found'
          s = s.replace(old_form, new_form, 1)

          old_js = '''  if (!validateEmail105101000000481025()) return false;

  var urlParams = new URLSearchParams(window.location.search);'''
          new_js = '''  if (!validateEmail105101000000481025()) return false;

  var contributionType = document.getElementById('host_Contribution_Type');
  var idea = document.getElementById('host_Idea');
  var description = document.getElementById('host_Description');
  if (!contributionType || contributionType.value.trim().length === 0) {
    alert('Please select how you would like to contribute.');
    if (contributionType) contributionType.focus();
    return false;
  }
  if (contributionType.value === 'Other' && idea && idea.value.trim().length === 0) {
    alert('Please tell us briefly what you have in mind.');
    idea.focus();
    return false;
  }
  var descriptionLines = [
    'CDW Contribution Type: ' + contributionType.value
  ];
  if (idea && idea.value.trim().length > 0) {
    descriptionLines.push('CDW Idea: ' + idea.value.trim());
  }
  description.value = descriptionLines.join('\\n');

  var urlParams = new URLSearchParams(window.location.search);'''
          assert old_js in s, 'Host validation target not found'
          s = s.replace(old_js, new_js, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add structured host contribution fields" || exit 0
          git push
