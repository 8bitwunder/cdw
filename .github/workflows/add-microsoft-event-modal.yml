name: Add Microsoft event modal

on:
  push:
    branches:
      - feature/microsoft-event-modal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/add-microsoft-event-modal.py
      - name: Commit event modal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Microsoft event agenda modal"
          git push
