name: Apply CDW date fix

on:
  push:
    branches:
      - fix/cdw-week-dates

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cdw-week-dates
          fetch-depth: 0

      - name: Update dates in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              'Canberra, ACT &middot; 2026': 'Canberra, ACT &middot; 28 SEP - 2 OCT 2026',
              '<div class="stat-card"><div class="stat-card__num">1</div><div class="stat-card__label">Week-long festival</div></div>': '<div class="stat-card"><div class="stat-card__num">5</div><div class="stat-card__label">Days &middot; Citywide data festival</div></div>',
              'A diverse program of free events across a full week. Browse the types of events you can attend, or apply to run your own as a partner host.': '28 September - 2 October 2026. A diverse program of free events across five days. Browse the types of events you can attend, or apply to run your own as a partner host.'
          }

          for old, new in replacements.items():
              if old not in html and new not in html:
                  raise SystemExit(f'Expected text not found: {old}')
              html = html.replace(old, new)

          path.write_text(html, encoding='utf-8')

      - name: Commit source changes
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains the requested dates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Canberra Data Week dates to homepage source"
          git push origin HEAD:fix/cdw-week-dates
