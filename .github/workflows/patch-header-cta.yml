name: Patch header CTA

on:
  push:
    branches:
      - fix/header-get-involved

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change header CTA only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = '<button class="btn btn--primary nav__cta" type="button" data-open-host-form>Apply to Host</button>'
          new = '<button class="btn btn--primary nav__cta" type="button" data-open-host-form>Get Involved</button>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one header CTA match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit one-line header change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change header CTA to Get Involved"
          git push
