name: Update PR 7 Zoho tokens

on:
  push:
    branches:
      - feature/host-form-contribution
    paths:
      - .github/workflows/update-pr7-zoho-tokens.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/host-form-contribution

      - name: Replace Zoho Web-to-Lead tokens only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('name="xnQsjsdp" value="d0cd93759843be90d03c2965838d80ae91747f32bea65892853a62e009da7b08"',
             'name="xnQsjsdp" value="5683a89b2d9045856e3aef3d76f1442974f5078fdb45e1c2afd749b5e28ee685"'),
            ('name="xmIwtLD" value="13ee5a86092d490f95c8c0471f36b94f105120933ac530d3b8b8a3ee645991560ceeab4bdfa4057ad1b616c85285b3d4"',
             'name="xmIwtLD" value="8c6bcace16d61d188e40e65e2b2c6c5d7601c52f5479ee683df5ed84540c47492975e644f78c2ae89485131e571d20c8"')
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit('Expected token not found')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit token update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Zoho Web-to-Lead tokens"
          git push origin HEAD:feature/host-form-contribution
