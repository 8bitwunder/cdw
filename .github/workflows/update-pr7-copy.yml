name: Update PR 7 copy

on:
  push:
    branches:
      - feature/host-form-contribution
    paths:
      - .github/workflows/update-pr7-copy.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/host-form-contribution

      - name: Update get involved and webinar copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              '<h2>Ready to host an event?</h2>\n    <p>Applications are open. Join a growing community of Canberra organisations using data to make a difference, and put your expertise on the public stage.</p>\n    <div class="cta-band__actions">\n      <button class="btn btn--primary" type="button" data-open-host-form>Apply to Host an Event</button>',
              '<h2>Ready to get involved?</h2>\n    <p>Canberra Data Week is built by the community. Tell us how you would like to contribute, from hosting an event or speaking to sharing data, offering a venue or supporting the week.</p>\n    <div class="cta-band__actions">\n      <button class="btn btn--primary" type="button" data-open-host-form>Get Involved</button>'
            ),
            (
              '<p class="mailing-dialog__eyebrow">Be part of the program</p>\n    <h2 id="host-form-title">Apply to host</h2>\n    <p class="mailing-dialog__intro">Tell us who you are and we will follow up about hosting an official Canberra Data Week event.</p>',
              '<p class="mailing-dialog__eyebrow">Be part of Canberra Data Week</p>\n    <h2 id="host-form-title">Get involved</h2>\n    <p class="mailing-dialog__intro">Tell us how you would like to contribute and a little about what you have in mind. We will follow up with the right next step.</p>'
            ),
            (
              'value="Submit application" aria-label="Submit host application" title="Submit host application"',
              'value="Submit interest" aria-label="Submit interest" title="Submit interest"'
            ),
            (
              '<li><a href="#host-form-dialog" data-open-host-form>Apply Now</a></li>',
              '<li><a href="#host-form-dialog" data-open-host-form>Get Involved</a></li>'
            ),
            (
              '<h3>Attend an Information Webinar</h3>\n            <p>Join one of our free online briefings to learn more about hosting, ask questions and refine your event concept before applying.</p>',
              '<h3>Join an Information Webinar</h3>\n            <p>Join one of three Tuesday online sessions at 5 pm to learn how Canberra Data Week works, explore ways to contribute, ask questions and shape your idea.</p>'
            ),
            (
              '<div class="webinar-box">\n          <h4>Information Webinars in 2026</h4>\n          <ul>\n            <li>Webinar 1: Date TBC (register to be notified)</li>\n            <li>Webinar 2: Date TBC (register to be notified)</li>\n            <li>Webinar 3: Date TBC (register to be notified)</li>\n          </ul>\n        </div>',
              '<div class="webinar-box">\n          <h4>Information Webinars, September 2026</h4>\n          <p>Join us online at 5 pm on any of the following Tuesdays.</p>\n          <ul>\n            <li>Tuesday 1 September, 5 pm, Online</li>\n            <li>Tuesday 8 September, 5 pm, Online</li>\n            <li>Tuesday 15 September, 5 pm, Online</li>\n          </ul>\n          <a class="btn btn--navy" href="https://www.trybooking.com/DPICX" target="_blank" rel="noopener noreferrer">Register for an Information Webinar</a>\n        </div>'
            )
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit('Target text not found: ' + old[:80])
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit copy changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Broaden get involved journey and add webinar dates"
          git push origin HEAD:feature/host-form-contribution
