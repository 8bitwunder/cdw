name: Update Zoho wildcard tokens

on:
  push:
    branches:
      - feature/host-form-contribution

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Zoho Web-to-Lead tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old_xn = '5683a89b2d9045856e3aef3d76f1442974f5078fdb45e1c2afd749b5e28ee685'
          new_xn = '1db847b866f5c90ba73300be6a6351123c3de97d986c414bcc2e4895e32e9a0b'
          old_xm = '8c6bcace16d61d188e40e65e2b2c6c5d7601c52f5479ee683df5ed84540c47492975e644f78c2ae89485131e571d20c8'
          new_xm = '3e26db49e3e41cbd2f6f900f0bf6bad5193ac3d23588773e6400d7e81b934b7ce173a413be5a0036d3dd854c894445c1'
          if old_xn not in text or old_xm not in text:
              raise SystemExit('Expected previous Zoho tokens were not found in index.html')
          text = text.replace(old_xn, new_xn, 1).replace(old_xm, new_xm, 1)
          p.write_text(text)
          PY
      - name: Commit token update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use wildcard-enabled Zoho webform tokens"
          git push
