name: Refine Microsoft event card UX

on:
  push:
    branches:
      - feature/microsoft-event-modal

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Microsoft event card interaction cues
        run: python .github/scripts/refine-microsoft-event-card.py
      - name: Commit UX refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Microsoft event card interaction clearer"
          git push
