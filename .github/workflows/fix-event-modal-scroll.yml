name: Fix event modal scroll

on:
  push:
    branches:
      - feature/event-card-status-ux
    paths:
      - .github/scripts/fix-event-modal-scroll.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply modal scroll patch
        run: python .github/scripts/fix-event-modal-scroll.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep Microsoft agenda scrolling inside modal" || exit 0
          git push
